name: Playbook policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playbook-policy:
    name: playbook-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify repository contracts
        run: npm run verify
      - name: Agent readiness diagnostic
        run: npm run agent:doctor -- --json
