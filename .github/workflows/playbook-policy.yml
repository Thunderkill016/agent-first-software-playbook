name: Playbook policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playbook-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playbook-policy:
    name: playbook-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Verify repository contracts
        run: npm run verify
      - name: Agent readiness diagnostic
        run: npm run agent:doctor -- --json
